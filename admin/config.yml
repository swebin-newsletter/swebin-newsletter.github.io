backend:
  name: github
  repo: swebin-dev/swebin-newsletter
  branch: main
  base_url: https://swebin-sveltia-auth.swebin-newsletter.workers.dev
  auth_methods: [oauth]

# Custom domain (newsletter.swebin.com) is not set up yet -- see MANUAL_ACTIONS_REQUIRED.md.
# Points at the real GitHub Pages URL until that DNS/CNAME work happens.
site_url: https://swebin-newsletter.github.io
display_url: https://swebin-newsletter.github.io
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: articles
    label: 기사 편집
    folder: content/articles
    path: '{{source_id}}/index'
    identifier_field: source_id
    create: false
    delete: false
    # 원문 날짜(source_published_at)를 맨 앞에 두어 목록에서 바로 최신순인지 알아볼 수 있게 하고,
    # sortable_fields로 "원문 날짜" 컬럼을 클릭해 최신순/오래된순 정렬을 직접 전환할 수 있게 합니다.
    # Sveltia/Decap CMS의 정렬 드롭다운은 각 필드의 label을 그대로 보여주며(별도 정렬 전용
    # 이름을 지정하는 설정은 없음), 그래서 아래 status/source_id 필드의 label을 정렬 목록에도
    # 어울리게 짧게 정리했습니다 (기존의 긴 안내 문구는 hint로 옮김). 컬렉션 목록의 자유 검색창은
    # 필드를 지정할 수 있는 설정이 없어 전체 항목을 검색하는 방식 그대로입니다.
    # 목록 한 줄(summary)에서 날짜·상태·ID 뒤, 제목 바로 앞에 에디터/외부필진 두 값을 각각 라벨과
    # 함께 보여줍니다. 한 기사는 둘 중 한쪽만 값이 있으므로, 에디터 기사는 "에디터 이재민 · 외부필진
    # —", 외부필진 기사는 "에디터 — · 외부필진 박인하" 처럼 어느 쪽인지 바로 구분됩니다.
    # (Sveltia CMS 목록에는 스프레드시트식 별도 컬럼 기능이 없어 - 0.174/0.189 번들 모두
    # summary_fields/list_columns 미지원 - 이 한 줄이 목록에서 필드를 보여주는 유일한 방법입니다.
    # 사람별로 묶거나 골라 보려면 아래 view_groups/view_filters를 함께 씁니다.)
    summary: "{{source_published_at}} · {{status}} · {{source_id}} · 에디터 {{source_editor | default('—')}} · 외부필진 {{source_external_writer | default('—')}} · {{newsletter_title}}"
    sortable_fields:
      [source_published_at, source_author, source_editor, source_external_writer, status, source_id]
    # 작성자별로 "골라서 보는" UI 두 가지: 필터(view_filters)와 그룹(view_groups).
    #
    # 필터는 5분할입니다 - 같은 사람이 기사에 따라 에디터도 외부필진도 되기 때문에(예: 김상철,
    # 박세민) 이름 필터를 역할별로 분리해 섞이지 않게 했습니다:
    #   ① 에디터 전체        ② 외부필진 전체
    #   ③ 에디터 이름별      ④ 외부필진 이름별
    #   ⑤ 이름별(역할 무관)  - source_author 기준. 겹치는 사람의 전체 기사(에디터+외부필진 합산)를
    #                          한 번에 봅니다. 예: 이름·김상철=62 = 에디터·김상철 45 + 외부필진·김상철 17.
    # Sveltia는 pattern을 정규식으로 컴파일해 값에 test()하므로(번들의 M2 = regex ? regex.test(...))
    # `^.+$`는 "그 역할로 표기된 기사 전부", `^이름$`은 그 사람만 정확히 고릅니다.
    # 이름 목록은 실제 데이터에서 생성했습니다(scratchpad/gen-author-filters.mjs). 새 필진이
    # 생기면 필터에는 자동 반영되지 않지만, 아래 view_groups의 "외부필진별"에는 자동으로 나타납니다.
    # 이름은 normalizeAuthorName으로 정규화되어(배가혜/이현석 등) 회사·직함 없이 표시됩니다.
    # [중요] 이 필터들의 "다중 선택"은 교집합(AND)입니다. 서로 다른 이름을 2개 이상 고르면
    # (한 기사의 작성자는 한 명이므로) 결과가 비어 버립니다 -- Sveltia 번들이 선택 필터를
    # selectedFilters.every(...)로 적용하도록 하드코딩되어 있고(0.174.0/0.189.1 동일), OR로
    # 바꾸는 config 옵션이 없습니다. 한 사람 전체 기사만 볼 때는 아래 ⑤ "이름 · OOO" 하나면
    # 되고(단일 선택은 정상), 여러 사람을 한 목록에서 함께 보려면 아래 view_groups의
    # "작성자별 (여러 명 함께 보기)" 그룹을 사용하세요.
    view_filters:
      # ① 에디터 전체
      - { label: 에디터 전체, field: source_editor, pattern: '^.+$' }
      # ② 외부필진 전체
      - { label: 외부필진 전체, field: source_external_writer, pattern: '^.+$' }
      # ③ 에디터 이름별
      - { label: '에디터 · 이재민 (3382)', field: source_editor, pattern: '^이재민$' }
      - { label: '에디터 · 이세인 (2810)', field: source_editor, pattern: '^이세인$' }
      - { label: '에디터 · 박세민 (484)', field: source_editor, pattern: '^박세민$' }
      - { label: '에디터 · 김상철 (45)', field: source_editor, pattern: '^김상철$' }
      # ④ 외부필진 이름별
      - { label: '외부필진 · 김상철 (17)', field: source_external_writer, pattern: '^김상철$' }
      - { label: '외부필진 · 박세민 (9)', field: source_external_writer, pattern: '^박세민$' }
      - { label: '외부필진 · 박인하 (4)', field: source_external_writer, pattern: '^박인하$' }
      - { label: '외부필진 · 이현석 (3)', field: source_external_writer, pattern: '^이현석$' }
      - { label: '외부필진 · 조경숙 (3)', field: source_external_writer, pattern: '^조경숙$' }
      - { label: '외부필진 · 최윤주 (3)', field: source_external_writer, pattern: '^최윤주$' }
      - { label: '외부필진 · 홍난지 (3)', field: source_external_writer, pattern: '^홍난지$' }
      - { label: '외부필진 · 정다빈 (3)', field: source_external_writer, pattern: '^정다빈$' }
      - { label: '외부필진 · 배가혜 (1)', field: source_external_writer, pattern: '^배가혜$' }
      - { label: '외부필진 · 조익상 (1)', field: source_external_writer, pattern: '^조익상$' }
      - { label: '외부필진 · 성인수 (1)', field: source_external_writer, pattern: '^성인수$' }
      - { label: '외부필진 · 이세인 (1)', field: source_external_writer, pattern: '^이세인$' }
      - { label: '외부필진 · 이지용 (1)', field: source_external_writer, pattern: '^이지용$' }
      - { label: '외부필진 · 조혜리 (1)', field: source_external_writer, pattern: '^조혜리$' }
      - { label: '외부필진 · 최예람 (1)', field: source_external_writer, pattern: '^최예람$' }
      # ⑤ 이름별 (역할 무관, 그 사람 기사 전부)
      - { label: '이름 · 이재민 (3382)', field: source_author, pattern: '^이재민$' }
      - { label: '이름 · 이세인 (2811)', field: source_author, pattern: '^이세인$' }
      - { label: '이름 · 박세민 (493)', field: source_author, pattern: '^박세민$' }
      - { label: '이름 · 김상철 (62)', field: source_author, pattern: '^김상철$' }
      - { label: '이름 · 박인하 (4)', field: source_author, pattern: '^박인하$' }
      - { label: '이름 · 이현석 (3)', field: source_author, pattern: '^이현석$' }
      - { label: '이름 · 조경숙 (3)', field: source_author, pattern: '^조경숙$' }
      - { label: '이름 · 최윤주 (3)', field: source_author, pattern: '^최윤주$' }
      - { label: '이름 · 홍난지 (3)', field: source_author, pattern: '^홍난지$' }
      - { label: '이름 · 정다빈 (3)', field: source_author, pattern: '^정다빈$' }
      - { label: '이름 · 배가혜 (1)', field: source_author, pattern: '^배가혜$' }
      - { label: '이름 · 조익상 (1)', field: source_author, pattern: '^조익상$' }
      - { label: '이름 · 성인수 (1)', field: source_author, pattern: '^성인수$' }
      - { label: '이름 · 이지용 (1)', field: source_author, pattern: '^이지용$' }
      - { label: '이름 · 조혜리 (1)', field: source_author, pattern: '^조혜리$' }
      - { label: '이름 · 최예람 (1)', field: source_author, pattern: '^최예람$' }
    # 여러 사람의 기사를 한 목록에서 함께 보고 싶을 때 쓰는 경로입니다(필터 다중 선택이 아니라).
    # "작성자별" 그룹은 각 작성자를 접이식 섹션으로 전부 나열하므로 사실상 합집합 보기가 됩니다.
    # 새 필진이 생기면 필터(view_filters)에는 자동 반영되지 않지만 이 그룹에는 자동으로 나타납니다.
    view_groups:
      - { label: 작성자별 (여러 명 함께 보기), field: source_author }
      - { label: 에디터별, field: source_editor }
      - { label: 외부필진별, field: source_external_writer }
      - { label: 카테고리별, field: source_category }
      - { label: 편집 상태별, field: status }
    fields:
      - {
          label: '1. 편집 상태',
          name: status,
          widget: select,
          options: [inbox, editing, ready, excluded],
          hint: '준비되면 "ready"로 바꿔주세요. inbox=크롤러가 방금 가져옴, editing=편집 중, ready=발행 준비 완료, excluded=사용 안 함',
        }
      - {
          label: '2. 뉴스레터 제목',
          name: newsletter_title,
          widget: string,
          required: false,
          hint: '비워두면 아래 원문 제목을 그대로 사용합니다.',
        }
      - {
          label: '3. 뉴스레터 요약',
          name: newsletter_summary,
          widget: text,
          required: false,
          hint: '비워두면 아래 원문 요약을 그대로 사용합니다.',
        }
      - { label: '4. 썸네일 이미지', name: thumbnail, widget: image, required: false }
      - {
          label: '5. 편집 메모 (팀 내부용, 독자에게 발송되지 않음)',
          name: editor_notes,
          widget: text,
          required: false,
        }
      - {
          label: '6. 뉴스레터 본문 (발행되는 경우에만)',
          name: body,
          widget: markdown,
          required: false,
        }
      - {
          label: 원문 ID,
          name: source_id,
          widget: string,
          readonly: true,
          hint: '— 원문 정보 (자동 수집됨, 직접 수정 금지) — 아래 필드들은 크롤러가 자동으로 채운 원문 정보입니다. 위 1~6번 필드만 직접 편집하세요.',
        }
      - { label: 원문 URL, name: source_url, widget: string, readonly: true }
      - { label: 원문 제목, name: source_title, widget: string, readonly: true }
      - { label: 작성자, name: source_author, widget: string, readonly: true }
      - {
          label: 에디터,
          name: source_editor,
          widget: string,
          readonly: true,
          required: false,
          hint: '원문에 "에디터"로 표기된 경우의 작성자명입니다. 외부필진 기사라면 비어 있습니다.',
        }
      - {
          label: 외부필진,
          name: source_external_writer,
          widget: string,
          readonly: true,
          required: false,
          hint: '원문에 "외부필진"으로 표기된 경우의 작성자명입니다. 에디터 기사라면 비어 있습니다. 같은 사람도 기사에 따라 에디터/외부필진이 달라지므로 사람이 아니라 기사 단위로 구분됩니다.',
        }
      - { label: 원문 날짜, name: source_published_at, widget: string, readonly: true }
      - { label: 카테고리, name: source_category, widget: string, readonly: true }
      - { label: 원문 요약, name: source_excerpt, widget: text, readonly: true, required: false }
      - {
          label: '원문 확인 완료 표시 (자동 기록)',
          name: last_reviewed_content_sha256,
          widget: string,
          required: false,
          hint: '화면 우측 하단 "원문 도구" 패널의 버튼으로 기록됩니다. 직접 입력하지 마세요.',
        }

  - name: issues
    label: 뉴스레터 호
    folder: content/issues
    path: '{{issue_id}}/index'
    identifier_field: issue_id
    create: true
    delete: true
    summary: '{{issue_id}} · {{status}} · {{subject}}'
    fields:
      - {
          label: '1. 호 ID',
          name: issue_id,
          widget: string,
          hint: '예: 2026-08 또는 2026-08-15 (연-월 또는 연-월-일 형식 둘 다 가능)',
        }
      - {
          label: '2. 상태',
          name: status,
          widget: select,
          default: unpublished,
          options: [published, unpublished],
          hint: 'unpublished=비공개 (공개 사이트에 나타나지 않음, 관리자 미리보기에서만 확인 가능) → published=공개 중. published로 바꾸면 다음 배포부터 공개 사이트에 나타나고, 다시 unpublished로 바꾸면 사라집니다. 기본값은 unpublished입니다 - 실수로 공개되는 것을 막기 위해, 새로 만든 호는 명시적으로 published로 바꾸기 전까지는 공개 사이트에 절대 나타나지 않습니다. 공개 저장소를 직접 수정하지 마세요.',
        }
      - { label: '3. 발행일', name: publish_date, widget: datetime, time_format: false }
      - { label: '4. 메일 제목', name: subject, widget: string }
      - {
          label: '5. 프리헤더 (메일 미리보기 문구)',
          name: preheader,
          widget: string,
          required: false,
        }
      - label: '6. 포함할 기사 (순서대로)'
        name: articles
        widget: list
        required: false
        summary: '{{fields.section}} · {{fields.source_id}}'
        fields:
          - label: 기사 선택
            name: source_id
            widget: relation
            collection: articles
            search_fields: [source_id, source_title, newsletter_title]
            value_field: source_id
            display_fields: [newsletter_title, source_id]
            hint: '"기사 편집"에서 status를 ready로 바꿔둔 기사만 검색되지는 않으니, 발행 준비가 끝난 기사만 골라주세요. 이미 다른 호에서 쓴 기사도 언제든 다시 선택할 수 있습니다.'
          - { label: '섹션 이름 (예: 이달의 이슈)', name: section, widget: string }
          - { label: 이 섹션 안에서의 순서, name: order, widget: number, value_type: int, min: 1 }
          - {
              label: 원문 기본값 그대로 사용,
              name: use_auto_content,
              widget: boolean,
              default: true,
              hint: '체크하면 아래 제목/본문/썸네일을 무시하고 "기사 편집"에 저장된 원문 기본값을 그대로 사용합니다. 이 호에서만 다르게 표시하려면 체크를 해제하고 아래를 채우세요.',
            }
          - {
              label: '제목 (직접 입력, 비우면 원문 기본값 사용)',
              name: title_override,
              widget: string,
              required: false,
            }
          - {
              label: '본문 (직접 입력, 비우면 원문 기본값 사용)',
              name: body_override,
              widget: text,
              required: false,
            }
          - {
              label: '썸네일 이미지 (직접 업로드, 비우면 원문 기본 이미지 사용)',
              name: thumbnail_override,
              widget: image,
              required: false,
            }
      - { label: '7. 도입문', name: intro, widget: markdown, required: false }
      - { label: '8. 맺음말', name: outro, widget: markdown, required: false }
      - {
          label: '9. 공개 URL (비워두면 호 ID 그대로 사용)',
          name: public_slug,
          widget: string,
          required: false,
          hint: '예: summer-special. 비워두면 공개 주소는 /issues/{{호 ID}}/ 그대로입니다.',
        }
      - {
          label: '주요 호로 표시',
          name: featured,
          widget: boolean,
          default: false,
          required: false,
        }

  - name: operations
    label: 운영 요청
    folder: content/operations
    path: '{{request_id}}'
    identifier_field: request_id
    create: true
    delete: false
    extension: json
    format: json
    summary: '{{action}} · {{status}} · {{request_id}}'
    fields:
      - {
          label: '1. 요청 ID',
          name: request_id,
          widget: string,
          hint: '직접 정하는 고유 ID (예: op-2026-08-01-01). 영문/숫자/하이픈을 권장합니다.',
        }
      - {
          label: '2. 작업 종류',
          name: action,
          widget: select,
          options:
            [
              crawl_recent,
              crawl_article,
              build_example_issue,
              publish_issue,
              unpublish_issue,
              redeploy_site,
              send_test,
            ],
          hint: 'crawl_recent=최근 기사 수집, crawl_article=특정 기사 재수집, build_example_issue=예시 호 생성, publish_issue=공개 전환, unpublish_issue=비공개 전환, redeploy_site=사이트 재배포, send_test=테스트 발송 요청',
        }
      - {
          label: '3. 대상',
          name: target,
          widget: string,
          required: false,
          hint: '작업에 따라 의미가 다릅니다 (예: 호 ID, 기사 URL 등).',
        }
      - {
          label: '4. 상태',
          name: status,
          widget: select,
          options: [requested, processing, completed, failed, cancelled],
          default: requested,
          hint: '요청할 때는 항상 requested로 두세요. 이후 진행 상황은 기술 관리자가 갱신합니다.',
        }
      - { label: '5. 요청자', name: requested_by, widget: string, required: false }
      - {
          label: '6. 요청 일시',
          name: requested_at,
          widget: datetime,
          hint: '보통 저장 시점 그대로 두면 됩니다.',
        }
      - {
          label: '7. 확인 문구 (실제 발송 등 위험한 작업만 필요)',
          name: confirmation,
          widget: string,
          required: false,
          hint: '예: 실제 발송 요청이라면 대상 호 ID를 정확히 한 번 더 입력합니다.',
        }
      - {
          label: '— 처리 결과 (기술 관리자가 기록, 직접 입력 금지) —',
          name: result_summary,
          widget: text,
          required: false,
          hint: '아래 필드는 요청 처리 후 기술 관리자가 채웁니다.',
        }
      - { label: '결과 링크', name: result_url, widget: string, required: false }
      - { label: '완료 일시', name: completed_at, widget: string, required: false }
