backend:
  name: github
  repo: swebin-dev/swebin-newsletter
  branch: main
  base_url: https://swebin-sveltia-auth.swebin-newsletter.workers.dev
  auth_methods: [oauth]

# Custom domain (newsletter.swebin.com) is not set up yet -- see MANUAL_ACTIONS_REQUIRED.md.
# Points at the real GitHub Pages URL until that DNS/CNAME work happens.
site_url: https://swebin-newsletter.github.io
display_url: https://swebin-newsletter.github.io
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: articles
    label: 기사 편집
    folder: content/articles
    path: '{{source_id}}/index'
    identifier_field: source_id
    create: false
    delete: false
    summary: '{{status}} · {{source_id}} · {{newsletter_title}}'
    fields:
      - {
          label: '1. 편집 상태 (준비되면 "ready"로 바꿔주세요)',
          name: status,
          widget: select,
          options: [inbox, editing, ready, excluded],
          hint: 'inbox=크롤러가 방금 가져옴, editing=편집 중, ready=발행 준비 완료, excluded=사용 안 함',
        }
      - {
          label: '2. 뉴스레터 제목',
          name: newsletter_title,
          widget: string,
          required: false,
          hint: '비워두면 아래 원문 제목을 그대로 사용합니다.',
        }
      - {
          label: '3. 뉴스레터 요약',
          name: newsletter_summary,
          widget: text,
          required: false,
          hint: '비워두면 아래 원문 요약을 그대로 사용합니다.',
        }
      - { label: '4. 썸네일 이미지', name: thumbnail, widget: image, required: false }
      - {
          label: '5. 편집 메모 (팀 내부용, 독자에게 발송되지 않음)',
          name: editor_notes,
          widget: text,
          required: false,
        }
      - {
          label: '6. 뉴스레터 본문 (발행되는 경우에만)',
          name: body,
          widget: markdown,
          required: false,
        }
      - {
          label: '— 원문 정보 (자동 수집됨, 직접 수정 금지) —',
          name: source_id,
          widget: string,
          readonly: true,
          hint: '아래 필드들은 크롤러가 자동으로 채운 원문 정보입니다. 위 1~6번 필드만 직접 편집하세요.',
        }
      - { label: 원문 URL, name: source_url, widget: string, readonly: true }
      - { label: 원문 제목, name: source_title, widget: string, readonly: true }
      - { label: 작성자, name: source_author, widget: string, readonly: true }
      - { label: 원문 날짜, name: source_published_at, widget: string, readonly: true }
      - { label: 카테고리, name: source_category, widget: string, readonly: true }
      - { label: 원문 요약, name: source_excerpt, widget: text, readonly: true, required: false }
      - {
          label: '원문 확인 완료 표시 (자동 기록)',
          name: last_reviewed_content_sha256,
          widget: string,
          required: false,
          hint: '화면 우측 하단 "원문 도구" 패널의 버튼으로 기록됩니다. 직접 입력하지 마세요.',
        }

  - name: issues
    label: 뉴스레터 호
    folder: content/issues
    path: '{{issue_id}}/index'
    identifier_field: issue_id
    create: true
    delete: false
    summary: '{{issue_id}} · {{status}} · {{visibility}} · {{subject}}'
    fields:
      - { label: '1. 호 ID', name: issue_id, widget: string, hint: '예: 2026-08 (연-월 형식)' }
      - {
          label: '2. 상태',
          name: status,
          widget: select,
          options:
            [
              draft,
              review_requested,
              approved,
              sending,
              sent,
              cancelled,
              ready,
              published,
              unpublished,
              archived,
            ],
          hint: 'draft=작성 중 → review_requested=검토 요청 → approved=발행 승인 → sending/sent는 발송 시 자동 전환됩니다. ready=이메일과 무관하게 공개 사이트에 낼 준비 완료 → published=공개 중 → unpublished/archived=비공개 (다음 배포부터 사이트에서 사라짐). 공개 사이트에서 내리려면 여기서 상태만 바꾸면 되며, 공개 저장소를 직접 수정하지 마세요.',
        }
      - {
          label: '2b. 공개 여부',
          name: visibility,
          widget: select,
          default: public,
          options: [public, hidden, internal_demo],
          hint: '상태(status)와는 별개의 스위치입니다. 공개(published/sent) 상태라도 여기를 숨김으로 바꾸면 다음 배포부터 즉시 공개 사이트에서 사라집니다(상태는 그대로 유지됩니다). "화면 확인용 샘플" 같은 내부 데모 콘텐츠는 internal_demo로 두세요 - 어떤 상태여도 공개 사이트에는 절대 나타나지 않고, 관리자 미리보기에서만 보입니다.',
        }
      - { label: '3. 발행일', name: publish_date, widget: datetime, time_format: false }
      - { label: '4. 메일 제목', name: subject, widget: string }
      - {
          label: '5. 프리헤더 (메일 미리보기 문구)',
          name: preheader,
          widget: string,
          required: false,
        }
      - label: '6. 포함할 기사 (순서대로)'
        name: articles
        widget: list
        required: false
        summary: '{{fields.section}} · {{fields.source_id}}'
        fields:
          - label: 기사 선택
            name: source_id
            widget: relation
            collection: articles
            search_fields: [source_id, source_title, newsletter_title]
            value_field: source_id
            display_fields: [newsletter_title, source_id]
            hint: '"기사 편집"에서 status를 ready로 바꿔둔 기사만 검색되지는 않으니, 발행 준비가 끝난 기사만 골라주세요.'
          - { label: '섹션 이름 (예: 이달의 이슈)', name: section, widget: string }
          - { label: 이 섹션 안에서의 순서, name: order, widget: number, value_type: int, min: 1 }
          - {
              label: 재사용 허용,
              name: allow_reuse,
              widget: boolean,
              default: false,
              hint: '이미 다른 호에 쓴 기사를 다시 쓰려면 체크하고 아래 사유/승인자를 채우세요.',
            }
          - { label: 재사용 사유, name: reuse_reason, widget: text, required: false }
          - { label: 재사용 승인자, name: reuse_approved_by, widget: string, required: false }
      - { label: '7. 도입문과 맺음말', name: body, widget: markdown, required: false }
      - {
          label: '8. 공개 URL (비워두면 호 ID 그대로 사용)',
          name: public_slug,
          widget: string,
          required: false,
          hint: '예: summer-special. 비워두면 공개 주소는 /issues/{{호 ID}}/ 그대로입니다.',
        }
      - {
          label: '주요 호로 표시',
          name: featured,
          widget: boolean,
          default: false,
          required: false,
        }

  - name: operations
    label: 운영 요청
    folder: content/operations
    path: '{{request_id}}'
    identifier_field: request_id
    create: true
    delete: false
    extension: json
    format: json
    summary: '{{action}} · {{status}} · {{request_id}}'
    fields:
      - {
          label: '1. 요청 ID',
          name: request_id,
          widget: string,
          hint: '직접 정하는 고유 ID (예: op-2026-08-01-01). 영문/숫자/하이픈을 권장합니다.',
        }
      - {
          label: '2. 작업 종류',
          name: action,
          widget: select,
          options:
            [
              crawl_recent,
              crawl_article,
              build_example_issue,
              publish_issue,
              unpublish_issue,
              archive_issue,
              redeploy_site,
              send_test,
            ],
          hint: 'crawl_recent=최근 기사 수집, crawl_article=특정 기사 재수집, build_example_issue=예시 호 생성, publish_issue=공개 전환, unpublish_issue=비공개 전환, archive_issue=보관 처리, redeploy_site=사이트 재배포, send_test=테스트 발송 요청',
        }
      - {
          label: '3. 대상',
          name: target,
          widget: string,
          required: false,
          hint: '작업에 따라 의미가 다릅니다 (예: 호 ID, 기사 URL 등).',
        }
      - {
          label: '4. 상태',
          name: status,
          widget: select,
          options: [requested, processing, completed, failed, cancelled],
          default: requested,
          hint: '요청할 때는 항상 requested로 두세요. 이후 진행 상황은 기술 관리자가 갱신합니다.',
        }
      - { label: '5. 요청자', name: requested_by, widget: string, required: false }
      - {
          label: '6. 요청 일시',
          name: requested_at,
          widget: datetime,
          hint: '보통 저장 시점 그대로 두면 됩니다.',
        }
      - {
          label: '7. 확인 문구 (실제 발송 등 위험한 작업만 필요)',
          name: confirmation,
          widget: string,
          required: false,
          hint: '예: 실제 발송 요청이라면 대상 호 ID를 정확히 한 번 더 입력합니다.',
        }
      - {
          label: '— 처리 결과 (기술 관리자가 기록, 직접 입력 금지) —',
          name: result_summary,
          widget: text,
          required: false,
          hint: '아래 필드는 요청 처리 후 기술 관리자가 채웁니다.',
        }
      - { label: '결과 링크', name: result_url, widget: string, required: false }
      - { label: '완료 일시', name: completed_at, widget: string, required: false }
