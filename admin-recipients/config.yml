backend:
  name: github
  repo: swebin-dev/swebin-newsletter-data
  branch: main
  base_url: https://swebin-sveltia-auth.swebin-newsletter.workers.dev
  auth_methods: [oauth]

# This is a SEPARATE Sveltia CMS instance from /admin/ (which manages the source repo's
# articles/issues). It is scoped to the private swebin-newsletter-data repo specifically so that
# recipient-list access can be granted independently of general editorial (article/issue) access
# -- someone who only edits content does not automatically get to see or change who receives the
# newsletter. Both instances share the same GitHub OAuth login flow via the same sveltia-auth
# Worker (base_url above); access is enforced by each person's real GitHub permissions on the
# repo the CMS instance is configured against, not by anything in this file.

site_url: https://swebin-newsletter.github.io
display_url: https://swebin-newsletter.github.io

# Sveltia CMS requires a media folder to be configured even though this instance has no image
# widgets (recipients/senders are plain data, no uploads) -- this repo has no public site of its
# own, so there's no meaningful public_folder; the value only needs to exist for Sveltia's config
# validator to pass.
media_folder: uploads
public_folder: /uploads

collections:
  - name: recipients
    label: 수신인 관리
    files:
      - name: recipients
        label: 발송 대상 이메일 목록
        file: data/recipients.json
        fields:
          - label: 수신인 목록
            name: recipients
            widget: list
            summary: '{{fields.email}}'
            collapsed: true
            allow_add: true
            hint: '수신인은 관리자가 여기서만 직접 추가/삭제/수정합니다 (공개 구독/해지 폼은 없습니다).'
            fields:
              - {
                  label: 이메일,
                  name: email,
                  widget: string,
                  pattern: ['^[^\s@]+@[^\s@]+\.[^\s@]+$', '올바른 이메일 형식이 아닙니다'],
                }
              - {
                  label: '활성화 (끄면 테스트/실제 발송 모두에서 완전히 제외됩니다)',
                  name: enabled,
                  widget: boolean,
                  default: true,
                }
              - {
                  label: '테스트 발송 대상 (test-send에서 이 주소를 고를 수 있음)',
                  name: receive_test,
                  widget: boolean,
                  default: true,
                }
              - {
                  label: '실제 발행 발송 대상 (켜면 정식 뉴스레터를 받습니다)',
                  name: receive_production,
                  widget: boolean,
                  default: true,
                  hint: '새로 추가한 테스트 전용 주소는 꺼둔 채로 시작하는 것을 권장합니다.',
                }
              - {
                  label: 추가일,
                  name: added_at,
                  widget: datetime,
                  format: 'YYYY-MM-DDTHH:mm:ssZ',
                  date_format: 'YYYY-MM-DD',
                  time_format: 'HH:mm',
                }
              - {
                  label: 추가한 사람,
                  name: added_by,
                  widget: string,
                  required: false,
                  hint: '직접 추가할 때는 본인 이름/아이디를 적어주세요.',
                }
              - { label: 메모, name: note, widget: string, required: false }
  - name: senders
    label: 발신 프로필 관리
    files:
      - name: senders
        label: 발신 프로필 목록
        file: data/senders.json
        fields:
          - label: 발신 프로필 (SMTP 비밀번호는 여기 없음 -- GitHub Secret에만 존재)
            name: senders
            widget: list
            summary: '{{fields.display_name}} ({{fields.id}})'
            collapsed: true
            hint: '새 발신 계정을 추가하려면 기술 관리자가 GitHub Secret을 먼저 설정해야 합니다 (docs/GMAIL_SENDER_SETUP_KO.md 참고). 여기서는 이미 준비된 프로필의 표시 정보만 관리합니다.'
            fields:
              - {
                  label: '1. 활성화',
                  name: enabled,
                  widget: boolean,
                  hint: '꺼두면 이 프로필은 발송 시 선택할 수 없습니다.',
                }
              - { label: '2. 기본 프로필 여부', name: is_default, widget: boolean }
              - { label: '3. 표시 이름 (관리자용)', name: display_name, widget: string }
              - {
                  label: '4. From 이름 (독자에게 보이는 발신자명)',
                  name: from_name,
                  widget: string,
                }
              - { label: '5. From 이메일', name: from_email, widget: string }
              - { label: '6. Reply-To (답장 받을 주소)', name: reply_to, widget: string }
              - { label: '7. 설명/메모', name: description, widget: text, required: false }
              - {
                  label: 'ID (코드가 참조하는 고유 식별자 -- 절대 변경 금지)',
                  name: id,
                  widget: string,
                  hint: '이미 만들어진 프로필의 ID는 바꾸면 안 됩니다. 새 프로필을 추가할 때만 새 ID를 정하세요.',
                }
              - { label: SMTP 인증 사용자, name: smtp_user, widget: string }
              - { label: SMTP Host, name: smtp_host, widget: string }
              - { label: SMTP Port, name: smtp_port, widget: number, value_type: int }
              - { label: SMTP TLS(secure), name: smtp_secure, widget: boolean }
              - {
                  label: GitHub Secret 이름 (비밀번호 자체는 여기가 아니라 GitHub Secrets에만 저장됨),
                  name: github_secret_name,
                  widget: string,
                }
