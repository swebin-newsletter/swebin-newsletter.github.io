        const form = document.getElementById('subscribe-form');
        const status = document.getElementById('subscribe-status');

        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          status.textContent = '처리 중...';
          const email = form.email.value.trim();
          const turnstileToken = form.querySelector('[name="cf-turnstile-response"]')?.value ?? '';
          if (!turnstileToken) {
            status.textContent = '자동 입력 방지 확인을 완료해 주세요.';
            return;
          }
          try {
            const res = await fetch(`${apiUrl}/api/subscribe`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, turnstileToken }),
            });
            const data = await res.json();
            if (res.ok) {
              status.textContent =
                data.status === 'already_subscribed'
                  ? '이미 구독 중인 이메일입니다.'
                  : '구독 신청이 완료되었습니다. 다음 발행부터 받아보실 수 있습니다.';
              form.reset();
              if (window.turnstile) window.turnstile.reset();
            } else if (data.error === 'turnstile_failed') {
              status.textContent = '자동 입력 방지 확인에 실패했습니다. 다시 시도해 주세요.';
            } else if (data.error === 'invalid_email') {
              status.textContent = '올바른 이메일 주소를 입력해 주세요.';
            } else if (data.error === 'rate_limited') {
              status.textContent = '잠시 후 다시 시도해 주세요.';
            } else {
              status.textContent = '구독 신청에 실패했습니다. 잠시 후 다시 시도해 주세요.';
            }
          } catch {
            status.textContent = '네트워크 오류로 구독 신청에 실패했습니다.';
          }
        });
      })();</script>
